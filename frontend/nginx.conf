server {
    listen 80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: serve index.html for unknown routes
    location / {
        try_files $uri /index.html;
    }

    # Do NOT terminate TLS or proxy /api or /dash here.
    # Host Nginx on EC2 handles HTTPS and reverse proxying.
}